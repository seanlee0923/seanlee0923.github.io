# 유저네임.github.io 입력
baseURL: https://seanlee0923.github.io/

# 한국, 한글
locale: "ko-kr"

# 블로그명 입력
title: "Sean's Tech and Life Blog"

# theme 에다가 방금 설치한 테마 이름 입력
theme:
  - PaperMod

# 타임존 입력 (UTC 가 편한 사람은 utc 로 사용하면 됨"
timeZone: "Asia/Seoul"

enableRobotsTXT: true

params:
  defaultTheme: auto
  ShowReadingTime: true
  ShowCodeCopyButtons: true
  ShowToc: true
  comments: true

  mainSections:
    - golang
    - devops
    - os
    - algorithm
    - etc
    - life

menus:
  main:
    - name: "Golang"
      url: "/golang/"
      weight: 10

    - name: "DevOps"
      url: "/devops/"
      weight: 20

    - name: "OS"
      url: "/os/"
      weight: 30

    - name: "알고리즘"
      url: "/algorithm/"
      weight: 40

    - name: "Etc"
      url: "/etc/"
      weight: 50

    - name: "Life"
      url: "/life/"
      weight: 60
